// Divine & Beast 鈥斺€?鍩轰簬 Curios API 鐨?Forge 1.20.1 楗板搧妲芥ā缁?// 鐢?Forge MDK(1.20.1) 妯℃澘绮剧畝鑰屾潵

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.6.47'
group = 'com.divinebeast'
archivesBaseName = 'divinebeast'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    // 浣跨敤瀹樻柟 Mojang 鏄犲皠锛?.20.1锛?    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')

            // Curios 浣跨敤 Mixin锛宒ev 杩愯鏃堕渶瑕佷互涓嬩袱涓睘鎬ф墠鑳芥纭?remap
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                divinebeast { source sourceSets.main }
            }
        }

        server {
            workingDirectory project.file('run')

            // Curios 浣跨敤 Mixin锛宒ev 杩愯鏃堕渶瑕佷互涓嬩袱涓睘鎬ф墠鑳芥纭?remap
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                divinebeast { source sourceSets.main }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'divinebeast', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                divinebeast { source sourceSets.main }
            }
        }
    }
}

// 鏁版嵁鐢熸垚杈撳嚭鐩綍锛坮unData 鐢熸垚鐗╀細杩涘叆杩欓噷锛?sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Curios 瀹樻柟 Maven 鈥斺€?浠呭湪鍚敤涓嬫柟 Curios API 渚濊禆鏃堕渶瑕?    maven {
        name = "Illusive Soulworks Maven"
        url = "https://maven.theillusivec4.top/"
    }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    // ------------------------------------------------------------------
    // Curios API
    // 鏈ā缁勯渶瑕?Curios 鐨?Java API 瀹炵幇銆屼僵鎴存牳蹇冮グ鍝佹椂鍔ㄦ€佽В閿?鏀跺洖妲戒綅銆?    // 锛圛Curio#getAttributeModifiers + CuriosApi.addSlotModifier锛夈€?    // 鎵€鏈?Curios 寮曠敤閮借闅旂鍦?CuriosCompat 绫讳腑骞跺仛杩愯鏃堕棬鎺э紝
    // 鍥犳 Curios 浠嶆槸"鍙€夊墠缃?锛氭湭瀹夎鏃剁墿鍝佺収甯稿瓨鍦紝鍙槸娌℃湁妲戒綅鑱斿姩銆?    // ------------------------------------------------------------------
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "divinebeast",
                "Specification-Vendor"    : "divinebeast",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "divinebeast",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
