version = "1.6.82"
displayName = "Divine & Beast 祂"
authors = "divinebeast"
description = """
基于 Curios API 的饰品模组（Forge 1.20.1）。核心两件：『祂』与『兽』；
各自配套 12 件「时刻」与 12 件「法则」饰品，逐件装备即可解除核心饰品的负面诅咒。

· 证悟之路：祂者初 → 救赎 → 祂者极 → 本心 → 真者祂（终极形态）
· 轮回之路：至高 → 智慧 → 生命 → 混沌 → 自·我（终极形态）
· 途中死亡会弹出「证悟抉择」，由你自己决定走上哪一条路
· 终极形态拥有大量可随时开关的权能。默认键位：C 救赎之击 / X 神行移速 /
  V 领域与真伤 / Z 脑后星环（可在 选项 → 控制 → 祂 · 兽 中修改）
· 真者祂：创造式飞行、免疫虚空与 /kill、攻击附加真伤与虚空伤害、光之领域范围伤害、
  脑后星环、万法附魔、蹈水履火（在水与岩浆中视野不受遮挡且移速不降低）等
· 击败末影龙 / 凋灵可分别获得「时刻」与「法则」饰品；另有可重复的绿宝石兑换任务

前置：需要 Curios API（1.20.1）。未安装时物品照常存在与合成，但所有槽位与效果关闭。
可选：安装 FTB Quests 后会自动向任务书注入本模组的饰品图鉴章节（含按键说明与注意事项）。

A Curios-API trinket mod for Forge 1.20.1. Two core trinkets — The Divine and
The Beast — each paired with 12 Moments / 12 Laws that lift its curses one by one.

· Ascension path: First of the Divine → Redemption → Extreme of the Divine →
  True Heart → True Divine (final form)
· Cycle path: Supreme → Wisdom → Life → Chaos → Self (final form)
· Dying along the way opens an ascension choice that decides which path you walk
· Final forms grant many powers you can toggle at any time. Default keys:
  C Redemption Strike / X Divine Stride / V Light Domain & True Damage /
  Z Orbit Aura (rebindable in Options → Controls → He · Beast)
· True Divine: creative flight, immunity to the void and to /kill, extra true and
  void damage on every hit, Light Domain area damage, orbit aura, divine
  enchanting, and unobstructed vision plus full speed in water and lava
· Slaying the Ender Dragon / the Wither drops Moment / Law trinkets; repeatable
  emerald-for-reward quests are also included

Requires Curios API (1.20.1); without it the items still exist and can be crafted,
but every slot and effect is disabled. Optional: with FTB Quests installed this mod
injects its trinket guide chapter into the quest book (key toggles and warnings included).
"""

# 说明：Curios 为可选前置 —— 所有 Curios API 引用都隔离在由 CompatChecks 门控的类中，
# 因此此处不声明任何 [[dependencies]] 段，未安装 Curios 时模组仍可正常加载（只是没有槽位与效果）。
